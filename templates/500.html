{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="fas fa-server" style="font-size: 100px; color: #ff6b6b;"></i>
    </div>
    
    <h1 class="display-1 fw-bold" style="color: #667eea;">500</h1>
    <h2 class="mb-4">Internal Server Error</h2>
    
    <p class="lead text-muted mb-5">
        Something went wrong on our end. We're working to fix it!
    </p>
    
    <div class="mt-5">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-5 py-3 me-3">
            <i class="fas fa-home"></i> Go Home
        </a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg px-5 py-3">
            <i class="fas fa-tachometer-alt"></i> Dashboard
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
