{% extends "base.html" %}

{% block title %}Login - Pneumonia Detection System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow">
            <div class="card-header text-white text-center py-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <h3 class="mb-0">
                    <i class="fas fa-sign-in-alt"></i> Login
                </h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" class="form-control form-control-lg" 
                               id="username" name="username" required autofocus 
                               placeholder="Enter your username">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg" 
                               id="password" name="password" required 
                               placeholder="Enter your password">
                    </div>
                    
                    <div class="d-grid gap-2 mb-4">
                        <button type="submit" class="btn btn-primary btn-lg" 
                                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-0">
                        Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">
                            Register here
                        </a>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Quick Demo Info -->
        <div class="alert alert-info mt-4">
            <h6><i class="fas fa-info-circle"></i> First Time User?</h6>
            <p class="mb-0">Click "Register" to create a new account and start using the pneumonia detection system!</p>
        </div>
    </div>
</div>
{% endblock %}
